# CI NüHabit: menjaga perlindungan keamanan tetap teruji setiap perubahan.
#
# Yang MEMBLOKIR (sudah diverifikasi hijau lokal):
#   - unit test (5000+, TZ=UTC), termasuk negative test: gerbang sesi
#     fail-closed, guard IAM per route, dan batas percobaan PIN/OTP/login.
#   - audit dependensi produksi pada level high/critical.
#   - lint: 0 error & 0 warning; jaga tetap bersih.
# Yang TIDAK memblokir:
#   - production build: butuh .env (terverifikasi gagal tanpanya) dan sudah
#     diuji setiap deploy lewat `docker build`. Menyusul bila env CI disiapkan.

name: CI

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Job Node berjalan di frontend/ (Next.js); backend Go punya job sendiri.
defaults:
  run:
    working-directory: frontend

jobs:
  test:
    name: Unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        # Versi disamakan dengan Dockerfile supaya resolusi lockfile identik.
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Unit test
        run: pnpm test

  audit:
    name: Audit dependensi produksi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit (gagal bila ada high/critical baru)
        run: pnpm audit --prod --audit-level=high

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

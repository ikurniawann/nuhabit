# CI NüHabit: menjaga perlindungan keamanan tetap teruji setiap perubahan.
#
# Yang MEMBLOKIR (sudah diverifikasi hijau lokal):
#   - unit test (5000+, TZ=UTC), termasuk negative test: gerbang sesi
#     fail-closed, guard IAM per route, dan batas percobaan PIN/OTP/login.
#   - audit dependensi produksi pada level high/critical.
#   - lint: 0 error & 0 warning; jaga tetap bersih.
#   - backend Go: go vet, gofmt, migrasi dari nol, lalu go test (unit +
#     integrasi) terhadap Postgres service container.
# Yang TIDAK memblokir:
#   - production build: butuh .env (terverifikasi gagal tanpanya) dan sudah
#     diuji setiap deploy lewat `docker build`. Menyusul bila env CI disiapkan.

name: CI

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Job Node berjalan di frontend/ (Next.js); backend Go punya job sendiri.
defaults:
  run:
    working-directory: frontend

jobs:
  test:
    name: Unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        # Versi disamakan dengan Dockerfile supaya resolusi lockfile identik.
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Unit test
        run: pnpm test

  audit:
    name: Audit dependensi produksi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit (gagal bila ada high/critical baru)
        run: pnpm audit --prod --audit-level=high

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nuhabit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # localhost passes the migration runner's local-target guard.
      MIGRATE_DATABASE_URL: postgres://postgres:postgres@localhost:5432/nuhabit?sslmode=disable
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/nuhabit?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: go vet
        run: go vet ./...

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "gofmt needed:"; echo "$unformatted"; exit 1; fi

      # The Next proxy forwards only routes listed in this manifest.
      - name: Route manifest is current
        run: |
          go run ./cmd/api -routes > "$RUNNER_TEMP/go-routes.json"
          if ! diff -u ../frontend/src/lib/go-routes.generated.json "$RUNNER_TEMP/go-routes.json"; then
            echo "Run: make -C backend generate"; exit 1
          fi

      # Some migrations GRANT to the Supabase-era roles; a fresh server lacks them.
      - name: Prepare fresh database
        run: |
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$ BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN CREATE ROLE authenticated NOLOGIN; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN CREATE ROLE anon NOLOGIN; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'service_role') THEN CREATE ROLE service_role NOLOGIN; END IF;
          END $$;
          SQL

      - name: Apply migrations
        run: go run ./cmd/migrate -apply

      - name: go test (unit + integration)
        run: go test ./... -count=1

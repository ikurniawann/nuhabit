# End-to-end browser suite (frontend/e2e): journeys for the public site,
# member booking, shop checkout and staff dashboard, plus a smoke walk of
# every static page with axe and overflow checks in light and dark mode.
#
# Runs on demand and nightly, not on every push: the whole run builds the Go
# API and Next, seeds a fresh Postgres and walks about 1100 page checks.
# The e2e accounts get fresh random passwords on every run; nothing is stored
# as a secret because the database lives only as long as the job.

name: E2E

on:
  workflow_dispatch:
  schedule:
    # 02:00 WIB
    - cron: "0 19 * * *"

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nuhabit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # localhost passes the local-target guard of the migration runner and the seeders.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/nuhabit?sslmode=disable
      MIGRATE_DATABASE_URL: postgres://postgres:postgres@localhost:5432/nuhabit?sslmode=disable
      BACKEND_URL: http://127.0.0.1:8080
      E2E_BASE_URL: http://127.0.0.1:3000
      E2E_STAFF_EMAIL: e2e-staff@nuhabit.test
      E2E_MEMBER_USERNAME: e2e-member@nuhabit.test
      E2E_PROMO_CODE: E2E10
      # The API runs with XENDIT_MOCK=1, so paying lands on the order status page.
      E2E_SHOP_PAY_MOCK: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            backend/database/pnpm-lock.yaml

      - name: Generate e2e passwords
        run: |
          for name in E2E_STAFF_PASSWORD E2E_MEMBER_PASSWORD; do
            value=$(openssl rand -base64 18)
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done

      # Some migrations GRANT to the Supabase-era roles; a fresh server lacks them.
      - name: Prepare fresh database
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$ BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN CREATE ROLE authenticated NOLOGIN; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN CREATE ROLE anon NOLOGIN; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'service_role') THEN CREATE ROLE service_role NOLOGIN; END IF;
          END $$;
          SQL

      - name: Apply migrations
        working-directory: backend
        run: go run ./cmd/migrate -apply

      - name: Seed base data, site demo and e2e accounts
        working-directory: backend/database
        run: |
          pnpm install --frozen-lockfile
          for seeder in business-hierarchy business-stalls hris-master-data iam-menus iam-admin-permissions iam-role-permissions; do
            node "seeders/$seeder.js"
          done
          node seeders/run-sql-file.js database/seeders/site-demo.sql
          node scripts/e2e-seed.js

      - name: Start Go API
        working-directory: backend
        run: |
          go build -o "$RUNNER_TEMP/api" ./cmd/api
          PORT=8080 APP_ENV=development XENDIT_MOCK=1 nohup "$RUNNER_TEMP/api" > "$RUNNER_TEMP/api.log" 2>&1 &
          timeout 60 bash -c 'until curl -sf http://127.0.0.1:8080/ready; do sleep 1; done'

      - name: Build and start Next
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          XENDIT_MOCK=1 nohup pnpm start -p 3000 -H 127.0.0.1 > "$RUNNER_TEMP/next.log" 2>&1 &
          timeout 60 bash -c 'until curl -sf -o /dev/null http://127.0.0.1:3000/; do sleep 1; done'

      - name: Install Playwright Chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Run e2e suite
        working-directory: frontend
        run: pnpm e2e

      - name: Collect server logs
        if: always()
        run: cp "$RUNNER_TEMP/api.log" "$RUNNER_TEMP/next.log" frontend/e2e/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            frontend/e2e/playwright-report
            frontend/e2e/test-results
            frontend/e2e/api.log
            frontend/e2e/next.log
          retention-days: 14
